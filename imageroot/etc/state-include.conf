#
# Restic --files-from patterns. state/environment is always included.
#
# Only what the image cannot regenerate: state/overrides/ and state/initdb.d/ are
# absent because bin/render-overrides rewrites them on every configure, and a
# stale copy restored over a newer template would be a regression.
#

# Restored by Restic itself, so no restore-side code handles it.
state/passwords.env

# From bin/module-dump-state. Not bbb_graphql: it is recreated on every start.
state/hasura_app.pg_dump
state/greenlight.pg_dump

# Recordings, presentations and published playback. The large one.
volumes/bigbluebutton

# Raw recorder output: without it, a recording captured but not yet processed is lost.
volumes/bbb-webrtc-recorder

# Greenlight uploads
volumes/greenlight

#
# Deliberately NOT backed up:
#   volumes/postgres-data       restored from the dumps above instead
#   volumes/redis-data          live meeting state and resque queues
#   volumes/mediasoup           per-meeting scratch
#   volumes/freeswitch-meetings per-meeting scratch
#
# So a restore loses every in-progress meeting, and any recording still queued in
# Redis: the raw media survives, the resque job that would process it does not.
#
