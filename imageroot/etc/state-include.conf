#
# BigBlueButton state/backup include patterns for Restic
# Syntax reference: https://pkg.go.dev/path/filepath#Glob
# Restic --files-from: https://restic.readthedocs.io/en/stable/040_backup.html#including-files
#
# state/environment is always included automatically.
#
# Rule of thumb: include only what the module image cannot regenerate.
# state/overrides/ and state/initdb.d/ are therefore absent on purpose --
# configure-module/30render_overrides rewrites them on every configure, and
# restoring a stale copy over a newer template would be a regression.
#

# Generated secrets. Restic restores this file, so no restore-side code exists
# for it. Mode 0600.
state/passwords.env

# PostgreSQL dumps produced by bin/module-dump-state
state/bbb_graphql.pg_dump
state/hasura_app.pg_dump
state/greenlight.pg_dump

# Recordings, presentations and published playback. The large one.
volumes/bigbluebutton

# Raw recorder output waiting to be processed by the recordings pipeline.
# Without it, a recording captured but not yet processed at backup time is lost.
volumes/bbb-webrtc-recorder

# Greenlight uploads (avatars, presentations attached to rooms)
volumes/greenlight

#
# Deliberately NOT backed up:
#   volumes/postgres-data       restored from the dumps above instead
#   volumes/redis-data          live meeting state and resque queues
#   volumes/mediasoup           per-meeting scratch
#   volumes/freeswitch-meetings per-meeting scratch
#
# Consequence, stated explicitly: a restore loses every in-progress meeting, and
# any recording still queued in Redis at backup time. The raw media survives in
# volumes/bigbluebutton and volumes/bbb-webrtc-recorder, but the resque job that
# would process it does not.
#
