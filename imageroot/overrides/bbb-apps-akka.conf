// Replaces /etc/bigbluebutton/bbb-apps-akka.conf.tmpl from
// alangecker/bbb-docker-apps-akka.
//
// Still a template: the apps-akka entrypoint copies it and substitutes DOMAIN,
// SHARED_SECRET and POSTGRES_PASSWORD with sed, so those placeholders are left
// exactly as upstream writes them.
//
// The only change is addressing. Upstream hardcodes the compose bridge
// addresses 10.7.7.5 (redis) and 10.7.7.32 (graphql-middleware). Those are IP
// literals, so the pod's --add-host entries cannot redirect them; inside the
// pod every peer is reachable on loopback.

// include default config from upstream
include "/bbb-apps-akka/conf/application.conf"

redis {
    host="127.0.0.1"
}

services {
  bbbWebAPI="https://DOMAIN/bigbluebutton/api"
  sharedSecret="SHARED_SECRET"
  graphqlMiddlewareAPI = "http://127.0.0.1:8378"
}
http {
  interface = "0.0.0.0"
}

postgres {
  properties = {
      serverName = "127.0.0.1"
      portNumber = "5432"
      databaseName = "bbb_graphql"
      user = "postgres"
      password = "POSTGRES_PASSWORD"
  }
}
