// Replaces /etc/bigbluebutton/bbb-apps-akka.conf.tmpl from
// alangecker/bbb-docker-apps-akka.
//
// Still a template: the entrypoint substitutes the placeholders with sed, so they
// are left exactly as upstream writes them.
//
// Only the addressing changes. Upstream's compose bridge addresses are IP
// literals, which the pod's --add-host entries cannot redirect.

// include default config from upstream
include "/bbb-apps-akka/conf/application.conf"

redis {
    host="127.0.0.1"
}

services {
  bbbWebAPI="https://DOMAIN/bigbluebutton/api"
  sharedSecret="SHARED_SECRET"
  graphqlMiddlewareAPI = "http://127.0.0.1:8378"
}
http {
  interface = "0.0.0.0"
}

postgres {
  properties = {
      serverName = "127.0.0.1"
      portNumber = "5432"
      databaseName = "bbb_graphql"
      user = "postgres"
      password = "POSTGRES_PASSWORD"
  }
}
