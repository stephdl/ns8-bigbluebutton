# Replaces /etc/nginx/conf.d/default.conf from alangecker/bbb-docker-nginx.
#
# Upstream points `location /` and `location /cable` at http://greenlight:3000.
# Greenlight is out of scope for this module, so that name does not resolve
# inside the pod -- but nginx does not fail closed. It falls through to DNS,
# where a search domain can turn "greenlight" into a real public host, and then
# every unmatched request, the site root included, is proxied out to a third
# party carrying its path, Host and Referer headers. Observed on the first test
# node, where it resolved to a public address and returned 504 after a timeout.
#
# Both locations are removed. `/` now returns 404 and nothing leaves the node.
# The two proxy_pass lines are the only change; everything else is verbatim
# upstream.

server {
  # proxied from HAProxy
  listen 48082 http2 proxy_protocol;
  listen 48081 proxy_protocol;

  # optional ports for other reverse proxies
  listen 48087 default_server;
  listen [::]:48087 default_server;

  server_name _;
  access_log /dev/stdout;
  absolute_redirect off;
  root /www/;

  # This variable is used instead of $scheme by bigbluebutton nginx include
  # files, so $scheme can be overridden in reverse-proxy configurations.
  set $real_scheme $scheme;

  # opt-out of google's floc tracking
  # https://www.eff.org/deeplinks/2021/03/googles-floc-terrible-idea
  add_header Permissions-Policy "interest-cohort=()";


  # Include specific rules for record and playback
  include /etc/nginx/bbb/*.nginx;

  # serve default.pdf from /www/
  location = /default.pdf {
    try_files $uri =404;
  }

  # There is no front end to serve here. Anything not matched by the includes
  # above is not ours, so say so instead of proxying it somewhere.
  location / {
    return 404;
  }
}

upstream hasura {
    least_conn;
    server bbb-graphql-server:8085;
    # you might want to add more bbb-graphql-server@ instances to balance the
    # load to multiple bbb-graphql-server instances. Execute
    # `systemctl enable --now bbb-graphql-server@8086` and uncomment the
    # following line:
    # server 127.0.0.1:8086;
}
server {
    listen 8185;

    root /var/www/html;

    location / {
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;

	    proxy_pass http://hasura;
    }
}
